{% extends "base.html" %}
{% block content %}

<div class="card p-4">
    <h3>⏱ Smart Study Timer</h3>

    <h1 id="timerDisplay">00:00</h1>

    <div class="mt-3">
        <button class="btn btn-success me-2" onclick="startTimer()">Start</button>
        <button class="btn btn-warning me-2" onclick="pauseTimer()">Pause</button>
        <button class="btn btn-danger" onclick="stopTimer()">Stop</button>
    </div>
</div>

<script>
let startTime = 0;
let elapsedTime = 0;
let timerInterval = null;
let isRunning = false;

function startTimer() {
    if (!isRunning) {
        startTime = Date.now() - elapsedTime;
        timerInterval = setInterval(updateTimer, 1000);
        isRunning = true;
    }
}

function pauseTimer() {
    if (isRunning) {
        clearInterval(timerInterval);
        elapsedTime = Date.now() - startTime;
        isRunning = false;
    }
}

function stopTimer() {
    if (isRunning) clearInterval(timerInterval);

    let totalTime = elapsedTime || (Date.now() - startTime);
    let actualMinutes = Math.floor(totalTime / 60000);

    // SEND TO BACKEND
    fetch("/save-study-time", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ minutes: actualMinutes })
    });

    alert("Study time saved: " + actualMinutes + " minutes");

    elapsedTime = 0;
    isRunning = false;
    document.getElementById("timerDisplay").innerText = "00:00";
}

function updateTimer() {
    let t = Date.now() - startTime;
    let m = Math.floor(t / 60000);
    let s = Math.floor((t % 60000) / 1000);
    document.getElementById("timerDisplay").innerText =
        String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0");
}
</script>

{% endblock %}
